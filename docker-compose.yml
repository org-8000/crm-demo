# P0 三组件编排：web(Next.js) + agentos(FastAPI/Agno) + postgres(pgvector)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mip}
      POSTGRES_DB: ${POSTGRES_DB:-mip}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./agentos/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  agentos:
    build: ./agentos
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mip}:${POSTGRES_PASSWORD:-mip}@postgres:5432/${POSTGRES_DB:-mip}
      OS_SECURITY_KEY: ${OS_SECURITY_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      PROXYCURL_API_KEY: ${PROXYCURL_API_KEY:-}
      AUTO_PROVISION_DBS: ${AUTO_PROVISION_DBS:-true}
      ENABLE_M2_GROUP_MONITOR: ${ENABLE_M2_GROUP_MONITOR:-false}
      ENABLE_M6_AUTOSEND: ${ENABLE_M6_AUTOSEND:-false}
      ENABLE_SOCIAL_DEEP_SCRAPE: ${ENABLE_SOCIAL_DEEP_SCRAPE:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    environment:
      AGENTOS_BASE_URL: http://agentos:8000
      OS_SECURITY_KEY: ${OS_SECURITY_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - agentos

volumes:
  pgdata:
